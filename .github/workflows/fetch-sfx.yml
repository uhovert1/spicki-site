# Временный: скачивает CC0-звуки с Freesound для интро (из контейнера Claude Freesound недоступен). Будет удалён.
name: fetch-sfx
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URL через пробел; пусто — только поиск"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch
        env:
          URLS: ${{ inputs.urls }}
        run: |
          mkdir -p out && cd out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          if [ -z "$URLS" ]; then
            i=0
            for q in "hookah" "shisha" "nargile" "waterpipe bubbling" "hookah exhale" "exhale smoke" "notification pop" "notification ding" "phone notification" "message notification"; do
              i=$((i+1))
              enc=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")
              curl -sL -A "$UA" -o "search-$i.html" -w "$q %{http_code}\n" "https://freesound.org/search/?q=$enc&f=license:%22Creative+Commons+0%22&s=Downloads+desc"
              echo "$q" > "search-$i.q"
              sleep 1
            done
            cat > /tmp/parse.py <<'PY'
          import re, glob, html, json, urllib.request, os, time
          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) Chrome/130"}
          rows = []
          for f in sorted(glob.glob("search-*.html"), key=lambda x: int(re.findall(r"\d+", x)[0])):
              q = open(f.replace(".html", ".q")).read().strip()
              t = open(f, encoding="utf-8", errors="ignore").read()
              prev = {}
              for m in re.finditer(r"https://cdn\.freesound\.org/previews/\d+/(\d+)_(\d+)-hq\.mp3", t):
                  prev.setdefault(m.group(1), m.group(0))
              seen = []
              for m in re.finditer(r'href="/people/([^/"]+)/sounds/(\d+)/"[^>]*>([^<]{1,140})<', t):
                  sid = m.group(2)
                  if sid in seen or sid not in prev: continue
                  seen.append(sid)
                  ctx = t[m.end(): m.end() + 4000]
                  dur = re.search(r"(\d+:\d{2}(?:\.\d+)?)", ctx)
                  rows.append({"q": q, "id": sid, "user": m.group(1), "title": html.unescape(m.group(3).strip()), "dur": dur.group(1) if dur else "", "mp3": prev[sid]})
              for r in [r for r in rows if r["q"] == q][:8]:
                  fn = "%s_%s.mp3" % (r["id"], re.sub(r"[^A-Za-z0-9]+", "-", r["title"])[:40])
                  if not os.path.exists(fn):
                      try:
                          open(fn, "wb").write(urllib.request.urlopen(urllib.request.Request(r["mp3"], headers=UA), timeout=30).read())
                      except Exception as e: print("fail", r["mp3"], e)
                      time.sleep(0.5)
                  r["file"] = fn
          json.dump(rows, open("index.json", "w"), ensure_ascii=False, indent=1)
          print(len(rows), "rows")
          PY
            python3 /tmp/parse.py
            rm -f search-*.html search-*.q
          else
            for u in $URLS; do
              f=$(echo "$u" | sed 's|https\?://||; s|[^A-Za-z0-9._-]|_|g')
              curl -sL -A "$UA" -o "$f" -w "$u %{http_code} %{size_download}\n" "$u"
              sleep 1
            done
          fi
          ls -la
      - name: Push to sfx-tmp branch
        run: |
          cd out
          git init -q -b sfx-tmp
          git config user.name "sfx-bot"; git config user.email "sfx-bot@users.noreply.github.com"
          git add -A && git commit -qm "sfx $(date -u +%FT%T)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" sfx-tmp
